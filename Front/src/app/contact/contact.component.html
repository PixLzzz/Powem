<div class="page-shell">
  <div class="section-heading" style="text-align:center;">
    <h1>Contact</h1>
    <p class="subtitle">Une remarque ? Une suggestion ? N'hesitez pas a m'ecrire.</p>
    <hr class="divider" style="margin-left:auto;margin-right:auto;">
  </div>

  <div class="contact-card card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <mat-form-field appearance="outline" class="field-half">
          <mat-label>Nom</mat-label>
          <input matInput type="text" formControlName="name" placeholder="Votre nom">
          <mat-icon matPrefix>person_outline</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="field-half">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="votre@email.com">
          <mat-icon matPrefix>mail_outline</mat-icon>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="field-full">
        <mat-label>Message</mat-label>
        <textarea matInput formControlName="message" placeholder="Votre message..." rows="7"></textarea>
      </mat-form-field>

      <div class="form-actions">
        <button class="pill-btn pill-btn--accent" type="submit" [disabled]="form.invalid">
          <mat-icon style="font-size:16px;height:16px;width:16px;">send</mat-icon>
          Envoyer
        </button>
      </div>
    </form>
  </div>
</div>
