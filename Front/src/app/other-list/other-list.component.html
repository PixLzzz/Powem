<div class="page-shell">
  <div class="list-header">
    <div class="section-heading">
      <h1>Proses</h1>
      <p class="subtitle">{{ dataSource?.data?.length || 0 }} texte{{ (dataSource?.data?.length || 0) !== 1 ? 's' : '' }}</p>
      <hr class="divider">
    </div>
    <button *ngIf="user" class="pill-btn" (click)="onNewOther()">
      <mat-icon style="font-size:16px;height:16px;width:16px;">add</mat-icon>
      Nouveau
    </button>
  </div>

  <div class="search-bar">
    <mat-icon>search</mat-icon>
    <input (keyup)="applyFilter($any($event.target).value)" placeholder="Rechercher..." />
  </div>

  <div class="entries" *ngIf="dataSource">
    <div
      class="entry"
      *ngFor="let other of dataSource.filteredData; let i = index"
      (click)="onViewOther(dataSource.data.indexOf(other))">
      <span class="entry-num">{{ i + 1 < 10 ? '0' + (i + 1) : (i + 1) }}</span>
      <div class="entry-body">
        <span class="entry-title">{{ other.title }}</span>
        <span class="entry-tag" *ngIf="other.category">{{ other.category }}</span>
      </div>
      <button
        *ngIf="user"
        class="delete-btn"
        mat-icon-button
        (click)="$event.stopPropagation(); openDialog(other)">
        <mat-icon>delete_outline</mat-icon>
      </button>
      <mat-icon class="entry-chevron">chevron_right</mat-icon>
    </div>

    <div class="empty-state" *ngIf="dataSource.filteredData.length === 0">
      <mat-icon>search_off</mat-icon>
      <p>Aucun resultat</p>
    </div>
  </div>

  <div class="empty-state" *ngIf="!dataSource">
    <mat-icon>hourglass_empty</mat-icon>
    <p>Chargement...</p>
  </div>
</div>
