<div class="page-shell page-shell--wide">
  <div class="skill-layout">
    <div class="skill-main card">
      <div class="card-top">
        <div *ngIf="user" class="edit-toggle">
          <mat-slide-toggle [checked]="isCheck" (change)="onChange()">Modifier</mat-slide-toggle>
        </div>
      </div>

      <div *ngIf="isCheck==false" class="card-body">
        <h1 class="piece-title">{{ skill.title }}</h1>

        <div *ngIf="skill.photo" class="photo-section">
          <img [src]="skill.photo" alt="">
        </div>

        <pre class="body-text">{{ skill.content }}</pre>

        <div class="card-actions">
          <button class="ghost-btn" (click)="onBack()">
            <mat-icon style="font-size:16px;height:16px;width:16px;">arrow_back</mat-icon>
            Retour
          </button>
          <button *ngIf="user" mat-icon-button class="delete-btn" (click)="openDialog()">
            <mat-icon>delete_outline</mat-icon>
          </button>
        </div>
      </div>

      <div *ngIf="isCheck==true" class="card-body">
        <h4>Photo</h4>
        <input type="file" (change)="detectFiles($event)" class="file-input" accept="image/*">
        <p class="text-success" *ngIf="fileUploaded">Fichier charge !</p>
        <button class="ghost-btn" style="margin: 12px 0;" (click)="rmPics()">Supprimer photo</button>

        <h4>Audio</h4>
        <input type="file" (change)="detectAudio($event)" class="file-input" accept="audio/*">
        <p class="text-success" *ngIf="audioUploaded">Fichier charge !</p>
        <button class="ghost-btn" style="margin: 12px 0;" (click)="rmAudio()">Supprimer audio</button>

        <form [formGroup]="skillForm" (ngSubmit)="updateSkill()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Titre</mat-label>
            <input matInput id="title" formControlName="title">
          </mat-form-field>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Contenu</mat-label>
            <textarea matInput rows="20" id="content" formControlName="content"></textarea>
          </mat-form-field>
          <button class="pill-btn" [disabled]="skillForm.invalid" type="submit">Enregistrer</button>
        </form>
      </div>
    </div>

    <aside class="skill-sidebar">
      <div *ngIf="skill.audio" class="sidebar-card card">
        <div class="sidebar-card-body">
          <h3 class="sidebar-title">Audio</h3>
          <audio [src]="audioSrc" controls preload="metadata"></audio>
        </div>
      </div>

      <div *ngIf="user && isCheck" class="sidebar-card card">
        <div class="sidebar-card-body">
          <h3 class="sidebar-title">Ajouter un fichier</h3>
          <app-upload-form [id]="id"></app-upload-form>
        </div>
      </div>

      <div class="sidebar-card card">
        <div class="sidebar-card-body">
          <h3 class="sidebar-title">Fichiers</h3>
          <div *ngIf="filess && filess.length > 0" class="files-list">
            <div class="file-row" *ngFor="let f of filess">
              <a [href]="f.url" target="_blank" rel="noopener" class="file-link">
                <mat-icon class="file-icon">insert_drive_file</mat-icon>
                <span>{{f.name}}</span>
              </a>
              <button *ngIf="user && isCheck" mat-raised-button color="warn" class="delete-file-btn" (click)="openDialogFile(f.name)">
                <mat-icon>delete</mat-icon> Supprimer
              </button>
            </div>
          </div>
          <p *ngIf="!filess || filess.length < 1" class="no-files">Aucun fichier</p>
        </div>
      </div>
    </aside>
  </div>
</div>
