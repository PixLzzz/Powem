<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <h1 class="login-title">Powem</h1>
      <p class="login-subtitle">Connexion</p>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="login-form">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email">
        <mat-icon matSuffix>email</mat-icon>
        <mat-error *ngIf="profileForm.get('email').hasError('required')">Email requis</mat-error>
        <mat-error *ngIf="profileForm.get('email').hasError('email')">Format invalide</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Mot de passe</mat-label>
        <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
        <button mat-icon-button matSuffix type="button" (click)="hide = !hide">
          <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="profileForm.get('password').hasError('required')">Mot de passe requis</mat-error>
        <mat-error *ngIf="profileForm.get('password').hasError('minlength')">6 caractères minimum</mat-error>
      </mat-form-field>

      <div class="error-message" *ngIf="errorMessage">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        class="submit-btn"
        [disabled]="profileForm.invalid">
        Se Connecter
      </button>
    </form>
  </div>
</div>
