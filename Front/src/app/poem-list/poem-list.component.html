<div class="list-page">

  <!-- Header -->
  <div class="list-header">
    <div>
      <h1 class="list-title">Poèmes</h1>
      <p class="list-sub">{{ dataSource?.data?.length || 0 }} œuvre{{ (dataSource?.data?.length || 0) !== 1 ? 's' : '' }}</p>
    </div>
    <button *ngIf="user" class="btn-primary-action" (click)="onNewPoem()">
      <mat-icon style="font-size:18px;height:18px;width:18px;">add</mat-icon>
      Nouveau
    </button>
  </div>

  <!-- Search -->
  <div class="search-bar">
    <mat-icon>search</mat-icon>
    <input (keyup)="applyFilter($event.target.value)" placeholder="Rechercher un poème…" />
  </div>

  <!-- List -->
  <div class="poem-entries" *ngIf="dataSource">
    <div
      class="poem-entry"
      *ngFor="let poem of dataSource.filteredData; let i = index"
      (click)="onViewPoem(dataSource.data.indexOf(poem))">
      <span class="entry-idx">{{ i + 1 < 10 ? '0' + (i + 1) : (i + 1) }}</span>
      <div class="entry-body">
        <span class="entry-title">{{ poem.title }}</span>
        <span class="entry-category" *ngIf="poem.category">{{ poem.category }}</span>
      </div>
      <button
        *ngIf="user"
        class="delete-btn"
        mat-icon-button
        (click)="$event.stopPropagation(); openDialog(poem)">
        <mat-icon>delete_outline</mat-icon>
      </button>
      <mat-icon class="entry-arrow">chevron_right</mat-icon>
    </div>

    <!-- Empty state -->
    <div class="empty-state" *ngIf="dataSource.filteredData.length === 0">
      <mat-icon>search_off</mat-icon>
      <p>Aucun résultat pour cette recherche</p>
    </div>
  </div>

  <!-- Loading -->
  <div class="empty-state" *ngIf="!dataSource">
    <mat-icon>hourglass_empty</mat-icon>
    <p>Chargement…</p>
  </div>

</div>
