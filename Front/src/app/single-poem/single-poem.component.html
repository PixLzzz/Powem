<div class="page-shell">
  <div class="reading-card card">
    <div class="card-top">
      <span class="category-tag" *ngIf="poem.category">{{ poem.category }}</span>
      <div class="edit-toggle">
        <mat-slide-toggle [checked]="isCheck" (change)="onChange()">Modifier</mat-slide-toggle>
      </div>
    </div>

    <div *ngIf="isCheck==false" class="card-body">
      <div *ngIf="poem.audio" class="audio-section">
        <audio [src]="audioSrc" controls preload="metadata"></audio>
      </div>

      <h1 class="piece-title">{{ poem.title }}</h1>

      <div *ngIf="poem.photo" class="photo-section">
        <img [src]="poem.photo" alt="">
      </div>

      <pre class="body-text">{{ poem.content }}</pre>

      <div class="card-actions">
        <button class="ghost-btn" (click)="onBack()">
          <mat-icon style="font-size:16px;height:16px;width:16px;">arrow_back</mat-icon>
          Retour
        </button>
      </div>
    </div>

    <div *ngIf="isCheck==true" class="card-body">
      <h4>Photo</h4>
      <input type="file" (change)="detectFiles($event)" class="file-input" accept="image/*">
      <p class="text-success" *ngIf="fileUploaded">Fichier charge !</p>
      <button class="ghost-btn" style="margin: 12px 0;" (click)="rmPics()">Supprimer photo</button>

      <h4>Audio</h4>
      <input type="file" (change)="detectAudio($event)" class="file-input" accept="audio/*">
      <p class="text-success" *ngIf="audioUploaded">Fichier charge !</p>
      <button class="ghost-btn" style="margin: 12px 0;" (click)="rmAudio()">Supprimer audio</button>

      <form [formGroup]="poemForm" (ngSubmit)="updatePoem()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Titre</mat-label>
          <input matInput id="title" formControlName="title">
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contenu</mat-label>
          <textarea matInput rows="20" id="content" formControlName="content"></textarea>
        </mat-form-field>
        <button class="pill-btn" [disabled]="poemForm.invalid" type="submit">Enregistrer</button>
      </form>
    </div>
  </div>
</div>
