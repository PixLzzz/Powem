<div class="home-hero">
  <!-- Decorative floating dots -->
  <span class="dot dot-1"></span>
  <span class="dot dot-2"></span>
  <span class="dot dot-3"></span>
  <span class="dot dot-4"></span>
  <span class="dot dot-5"></span>

  <!-- Giant quote watermark -->
  <svg class="quote-watermark" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="'Cormorant Garamond', serif" font-size="280" font-style="italic" fill="currentColor">&ldquo;</text>
  </svg>

  <div class="hero-center">
    <h1 class="hero-title">{{site.title}}</h1>
    <span class="hero-underline"></span>
    <p class="hero-sub">Poesie &middot; Prose &middot; Pensees</p>
  </div>

  <div class="scroll-hint">
    <mat-icon class="scroll-chevron">expand_more</mat-icon>
  </div>
</div>

<div class="home-content">
  <div *ngIf="user" class="edit-toggle">
    <mat-slide-toggle [checked]="isCheck" (change)="onChange()">Modifier</mat-slide-toggle>
  </div>

  <div *ngIf="isCheck==false" class="content-card card">
    <pre class="body-text drop-cap">{{ site.content }}</pre>
  </div>

  <div *ngIf="isCheck==true">
    <form [formGroup]="siteForm" (ngSubmit)="updateSite()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Titre</mat-label>
        <input matInput id="title" formControlName="title">
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Contenu</mat-label>
        <textarea matInput rows="20" id="content" formControlName="content"></textarea>
      </mat-form-field>
      <button class="pill-btn" [disabled]="siteForm.invalid" type="submit">Enregistrer</button>
    </form>
  </div>
</div>
