<div class="home-hero">
  <h1 class="hero-title">{{site.title}}</h1>
  <hr class="hero-line">
</div>

<div class="home-content">
  <div *ngIf="user" class="edit-toggle">
    <mat-slide-toggle [checked]="isCheck" (change)="onChange()">Modifier</mat-slide-toggle>
  </div>

  <div *ngIf="isCheck==false">
    <pre class="body-text">{{ site.content }}</pre>
  </div>

  <div *ngIf="isCheck==true">
    <form [formGroup]="siteForm" (ngSubmit)="updateSite()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Titre</mat-label>
        <input matInput id="title" formControlName="title">
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Contenu</mat-label>
        <textarea matInput rows="20" id="content" formControlName="content"></textarea>
      </mat-form-field>
      <button class="pill-btn" [disabled]="siteForm.invalid" type="submit">Enregistrer</button>
    </form>
  </div>
</div>
