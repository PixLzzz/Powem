<div class="home-hero">
  <!-- Thin decorative frame -->
  <div class="hero-frame">
    <span class="frame-corner frame-tl"></span>
    <span class="frame-corner frame-tr"></span>
    <span class="frame-corner frame-bl"></span>
    <span class="frame-corner frame-br"></span>
  </div>

  <!-- Central content -->
  <div class="hero-center">
    <span class="hero-overline">Poesie &middot; Prose &middot; Pensees</span>
    <h1 class="hero-title">{{site.title}}</h1>
    <div class="hero-rule">
      <span class="rule-line"></span>
      <span class="rule-diamond"></span>
      <span class="rule-line"></span>
    </div>
    <p class="hero-tagline">Un espace de partage, de mots et de savoirs</p>
  </div>

  <!-- Bottom navigation -->
  <div class="hero-nav">
    <a routerLink="/poem" class="hero-nav-item">
      <span class="nav-num">01</span>
      <span class="nav-label">Poemes</span>
    </a>
    <a routerLink="/other" class="hero-nav-item">
      <span class="nav-num">02</span>
      <span class="nav-label">Proses</span>
    </a>
    <a routerLink="/skillList" class="hero-nav-item">
      <span class="nav-num">03</span>
      <span class="nav-label">Skills</span>
    </a>
  </div>

  <!-- Scroll cue -->
  <div class="scroll-cue">
    <span class="scroll-bar"></span>
  </div>
</div>

<div class="home-content">
  <div *ngIf="user" class="edit-toggle">
    <mat-slide-toggle [checked]="isCheck" (change)="onChange()">Modifier</mat-slide-toggle>
  </div>

  <div *ngIf="isCheck==false" class="content-section">
    <div class="content-header">
      <span class="section-num">01</span>
      <div class="section-rule"></div>
      <span class="section-label">Introduction</span>
    </div>
    <div class="content-card card">
      <pre class="body-text drop-cap">{{ site.content }}</pre>
    </div>
  </div>

  <div *ngIf="isCheck==true">
    <form [formGroup]="siteForm" (ngSubmit)="updateSite()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Titre</mat-label>
        <input matInput id="title" formControlName="title">
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Contenu</mat-label>
        <textarea matInput rows="20" id="content" formControlName="content"></textarea>
      </mat-form-field>
      <button class="pill-btn" [disabled]="siteForm.invalid" type="submit">Enregistrer</button>
    </form>
  </div>
</div>
