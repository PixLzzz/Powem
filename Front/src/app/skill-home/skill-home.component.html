<div class="page-shell">
  <div class="section-heading">
    <h1>{{skillHome.title}}</h1>
    <hr class="divider">
  </div>

  <div *ngIf="user" class="edit-toggle">
    <mat-slide-toggle [checked]="isCheck" (change)="onChange()">Modifier</mat-slide-toggle>
  </div>

  <div *ngIf="isCheck==false">
    <pre class="body-text">{{ skillHome.content }}</pre>
  </div>

  <div *ngIf="isCheck==true">
    <form [formGroup]="skillHomeForm" (ngSubmit)="updateSkillHome()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Titre</mat-label>
        <input matInput id="title" formControlName="title">
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Contenu</mat-label>
        <textarea matInput rows="20" id="content" formControlName="content"></textarea>
      </mat-form-field>
      <button class="pill-btn" [disabled]="skillHomeForm.invalid" type="submit">Enregistrer</button>
    </form>
  </div>
</div>
